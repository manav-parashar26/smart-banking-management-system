<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad3)"/>
  <text x="640" y="40" fill="#f8fafc" font-size="24" font-weight="800" text-anchor="middle">DATA STRUCTURES &amp; ALGORITHMS (DSA) ARCHITECTURE</text>
  <text x="640" y="64" fill="#94a3b8" font-size="14" font-weight="500" text-anchor="middle">Mapping Real-World Banking Requirements to C++ STL Containers &amp; Algorithmic Complexities</text>

  <!-- Column Headers -->
  <rect x="70" y="85" width="350" height="30" rx="6" fill="#1e293b"/>
  <text x="245" y="105" fill="#38bdf8" font-size="12.5" font-weight="700" text-anchor="middle">1. BANKING FUNCTIONAL NEED</text>

  <rect x="440" y="85" width="440" height="30" rx="6" fill="#1e293b"/>
  <text x="660" y="105" fill="#34d399" font-size="12.5" font-weight="700" text-anchor="middle">2. C++ STL / CUSTOM DATA STRUCTURE</text>

  <rect x="900" y="85" width="310" height="30" rx="6" fill="#1e293b"/>
  <text x="1055" y="105" fill="#fbbf24" font-size="12.5" font-weight="700" text-anchor="middle">3. ALGORITHMIC COMPLEXITY</text>

  <!-- Row 1: Vector -->
  <g filter="url(#shadow3)">
    <rect x="70" y="125" width="350" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="85" y="148" fill="#f1f5f9" font-size="13" font-weight="600">Transaction History Ledger</text>
    <text x="85" y="165" fill="#94a3b8" font-size="11">Chronological account statement entries</text>

    <line x1="420" y1="150" x2="435" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="440" y="125" width="440" height="50" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="455" y="148" fill="#38bdf8" font-size="13" font-weight="700">std::vector&lt;Transaction&gt;</text>
    <text x="455" y="165" fill="#cbd5e1" font-size="11">Contiguous buffer, maximal CPU cache locality</text>

    <rect x="900" y="125" width="310" height="50" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="915" y="148" fill="#6ee7b7" font-size="13" font-weight="800">O(1) Amortized Append</text>
    <text x="915" y="165" fill="#a7f3d0" font-size="11">O(N) linear iteration for rendering</text>
  </g>

  <!-- Row 2: Unordered Map -->
  <g filter="url(#shadow3)">
    <rect x="70" y="185" width="350" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="85" y="208" fill="#f1f5f9" font-size="13" font-weight="600">Customer &amp; Account Lookup</text>
    <text x="85" y="225" fill="#94a3b8" font-size="11">Instant retrieval by string ID</text>

    <line x1="420" y1="210" x2="435" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="440" y="185" width="440" height="50" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="455" y="208" fill="#38bdf8" font-size="13" font-weight="700">std::unordered_map&lt;string, shared_ptr&lt;Account&gt;&gt;</text>
    <text x="455" y="225" fill="#cbd5e1" font-size="11">Hash table with bucket chaining (and CustomerManager)</text>

    <rect x="900" y="185" width="310" height="50" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="915" y="208" fill="#6ee7b7" font-size="13" font-weight="800">O(1) Average Lookup</text>
    <text x="915" y="225" fill="#a7f3d0" font-size="11">Benchmarked ~430x speedup vs vector</text>
  </g>

  <!-- Row 3: Map -->
  <g filter="url(#shadow3)">
    <rect x="70" y="245" width="350" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="85" y="268" fill="#f1f5f9" font-size="13" font-weight="600">Category Spending Aggregation</text>
    <text x="85" y="285" fill="#94a3b8" font-size="11">Sorted financial expenditure summary</text>

    <line x1="420" y1="270" x2="435" y2="270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="440" y="245" width="440" height="50" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="455" y="268" fill="#38bdf8" font-size="13" font-weight="700">std::map&lt;string, double&gt;</text>
    <text x="455" y="285" fill="#cbd5e1" font-size="11">Self-Balancing Red-Black Binary Search Tree</text>

    <rect x="900" y="245" width="310" height="50" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="915" y="268" fill="#a5b4fc" font-size="13" font-weight="800">O(log N) Insert &amp; Search</text>
    <text x="915" y="285" fill="#c7d2fe" font-size="11">In-order traversal yields alphabetical sort</text>
  </g>

  <!-- Row 4: Set -->
  <g filter="url(#shadow3)">
    <rect x="70" y="305" width="350" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="85" y="328" fill="#f1f5f9" font-size="13" font-weight="600">Counterparty Deduplication</text>
    <text x="85" y="345" fill="#94a3b8" font-size="11">Unique merchant / transaction ID sets</text>

    <line x1="420" y1="330" x2="435" y2="330" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="440" y="305" width="440" height="50" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="455" y="328" fill="#38bdf8" font-size="13" font-weight="700">std::set&lt;string&gt;</text>
    <text x="455" y="345" fill="#cbd5e1" font-size="11">Balanced Binary Search Tree with unique keys</text>

    <rect x="900" y="305" width="310" height="50" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="915" y="328" fill="#a5b4fc" font-size="13" font-weight="800">O(log N) Insertion</text>
    <text x="915" y="345" fill="#c7d2fe" font-size="11">Duplicates automatically rejected</text>
  </g>

  <!-- Row 5: Queue -->
  <g filter="url(#shadow3)">
    <rect x="70" y="365" width="350" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="85" y="388" fill="#f1f5f9" font-size="13" font-weight="600">Pending Request Approval Pipeline</text>
    <text x="85" y="405" fill="#94a3b8" font-size="11">Loan applications &amp; unblock requests</text>

    <line x1="420" y1="390" x2="435" y2="390" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="440" y="365" width="440" height="50" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="455" y="388" fill="#38bdf8" font-size="13" font-weight="700">std::queue&lt;BankingRequest&gt;</text>
    <text x="455" y="405" fill="#cbd5e1" font-size="11">First-In, First-Out (FIFO) pipeline</text>

    <rect x="900" y="365" width="310" height="50" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="915" y="388" fill="#6ee7b7" font-size="13" font-weight="800">O(1) Enqueue / Dequeue</text>
    <text x="915" y="405" fill="#a7f3d0" font-size="11">Guarantees strict submission fairness</text>
  </g>

  <!-- Row 6: Stack -->
  <g filter="url(#shadow3)">
    <rect x="70" y="425" width="350" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="85" y="448" fill="#f1f5f9" font-size="13" font-weight="600">Transaction Reversal &amp; Undo</text>
    <text x="85" y="465" fill="#94a3b8" font-size="11">Multi-step cascading rollback engine</text>

    <line x1="420" y1="450" x2="435" y2="450" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="440" y="425" width="440" height="50" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="455" y="448" fill="#38bdf8" font-size="13" font-weight="700">std::stack&lt;TransactionReversal&gt;</text>
    <text x="455" y="465" fill="#cbd5e1" font-size="11">Last-In, First-Out (LIFO) compensation stack</text>

    <rect x="900" y="425" width="310" height="50" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="915" y="448" fill="#6ee7b7" font-size="13" font-weight="800">O(1) Push / Pop</text>
    <text x="915" y="465" fill="#a7f3d0" font-size="11">Reverses operations in reverse order</text>
  </g>

  <!-- Row 7: Binary Search -->
  <g filter="url(#shadow3)">
    <rect x="70" y="485" width="350" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="85" y="508" fill="#f1f5f9" font-size="13" font-weight="600">Chronological Date-Range Search</text>
    <text x="85" y="525" fill="#94a3b8" font-size="11">Filtering ledgers by timestamp</text>

    <line x1="420" y1="510" x2="435" y2="510" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="440" y="485" width="440" height="50" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="455" y="508" fill="#38bdf8" font-size="13" font-weight="700">std::lower_bound (Binary Search)</text>
    <text x="455" y="525" fill="#cbd5e1" font-size="11">Logarithmic boundary search over sorted vectors</text>

    <rect x="900" y="485" width="310" height="50" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="915" y="508" fill="#a5b4fc" font-size="13" font-weight="800">O(log N) Comparisons</text>
    <text x="915" y="525" fill="#c7d2fe" font-size="11">Benchmarked ~265x-375x speedup</text>
  </g>

  <!-- Row 8: Directed Graph & DFS -->
  <g filter="url(#shadow3)">
    <rect x="70" y="545" width="350" height="135" rx="6" fill="#0f172a" stroke="#f43f5e"/>
    <text x="85" y="575" fill="#fda4af" font-size="14" font-weight="700">Forensic AML Transaction Graph</text>
    <text x="85" y="598" fill="#cbd5e1" font-size="11.5">&#8226; Inter-account capital flow modeling</text>
    <text x="85" y="618" fill="#cbd5e1" font-size="11.5">&#8226; Forensic Anti-Money Laundering analysis</text>
    <text x="85" y="638" fill="#cbd5e1" font-size="11.5">&#8226; Circular fund transfer ring detection</text>
    <text x="85" y="658" fill="#94a3b8" font-size="11">Wash-trading &amp; layering patterns</text>

    <line x1="420" y1="612" x2="435" y2="612" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="440" y="545" width="440" height="135" rx="6" fill="#0f172a" stroke="#f43f5e"/>
    <text x="455" y="575" fill="#fda4af" font-size="14" font-weight="700">Directed Graph + DFS Cycle Detection</text>
    <text x="455" y="598" fill="#f1f5f9" font-size="12">1. Graph: <tspan fill="#38bdf8" font-family="monospace">unordered_map&lt;string, vector&lt;Edge&gt;&gt;</tspan></text>
    <text x="470" y="616" fill="#94a3b8" font-size="11">Vertices V = Accounts, Directed Edges E = Transfers</text>
    <text x="455" y="638" fill="#f1f5f9" font-size="12">2. Traversal: <tspan fill="#38bdf8" font-weight="700">Depth-First Search (DFS)</tspan></text>
    <text x="470" y="658" fill="#94a3b8" font-size="11">Three-color recursion-stack state tracking</text>

    <rect x="900" y="545" width="310" height="135" rx="6" fill="#4c0519" stroke="#f43f5e"/>
    <text x="915" y="575" fill="#fda4af" font-size="14" font-weight="800">O(V + E) Linear Time</text>
    <text x="915" y="602" fill="#fecdd3" font-size="11.5">&#8226; Space: O(V + E) Adjacency List</text>
    <text x="915" y="622" fill="#fecdd3" font-size="11.5">&#8226; Cycle Finder: O(V + E) DFS</text>
    <text x="915" y="642" fill="#fecdd3" font-size="11.5">&#8226; Output: A &#8594; B &#8594; C &#8594; A routing rings</text>
    <text x="915" y="662" fill="#fecdd3" font-size="11.5">&#8226; Visualized live in React Dashboard</text>
  </g>
</svg>