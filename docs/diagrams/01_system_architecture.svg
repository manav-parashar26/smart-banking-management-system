<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <text x="640" y="42" fill="#f8fafc" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="0.5">SMART BANKING MANAGEMENT SYSTEM</text>
  <text x="640" y="68" fill="#94a3b8" font-size="14" font-weight="500" text-anchor="middle">5-Tier Full-Stack System Architecture &amp; Component Interaction</text>

  <!-- TIER 1: FRONTEND -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="90" width="1000" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="140" y="90" width="1000" height="28" rx="10" fill="#1e293b"/>
    <text x="160" y="109" fill="#38bdf8" font-size="12" font-weight="700">TIER 1: CLIENT PRESENTATION LAYER (BROWSER)</text>
    
    <!-- Sub-boxes -->
    <rect x="160" y="126" width="310" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="315" y="145" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">React 18 SPA (Babel Standalone)</text>
    <text x="315" y="161" fill="#94a3b8" font-size="11" text-anchor="middle">Zero npm/Node Dependency - UMD CDN</text>

    <rect x="490" y="126" width="300" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="640" y="145" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">Customer Portal</text>
    <text x="640" y="161" fill="#94a3b8" font-size="11" text-anchor="middle">Session Scoped Accounts, Transfers, Health</text>

    <rect x="810" y="126" width="310" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="965" y="145" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle">Admin Management Dashboard</text>
    <text x="965" y="161" fill="#94a3b8" font-size="11" text-anchor="middle">FIFO Queue, LIFO Undo, AML Visualizer</text>
  </g>

  <!-- Connectors Tier 1 to 2 -->
  <line x1="640" y1="180" x2="640" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="187" width="240" height="20" rx="10" fill="#0369a1"/>
  <text x="640" y="201" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">HTTP / JSON REST API (Port 8080)</text>

  <!-- TIER 2: C++ WINSOCK SERVER -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="215" width="1000" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <rect x="140" y="215" width="1000" height="28" rx="10" fill="#1e293b"/>
    <text x="160" y="234" fill="#38bdf8" font-size="12" font-weight="700">TIER 2: C++17 EMBEDDED NETWORKING &amp; DISPATCH LAYER</text>

    <!-- Sub-boxes -->
    <rect x="160" y="250" width="220" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="270" y="267" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">Winsock2 TCP Engine</text>
    <text x="270" y="282" fill="#94a3b8" font-size="10.5" text-anchor="middle">HttpServer.cpp (Port 8080)</text>

    <rect x="400" y="250" width="230" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="515" y="267" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">JSON Parser &amp; DTOs</text>
    <text x="515" y="282" fill="#94a3b8" font-size="10.5" text-anchor="middle">JsonHelper.h / BankingDTOs.h</text>

    <rect x="650" y="250" width="250" height="40" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-dasharray="3,3"/>
    <text x="775" y="267" fill="#fda4af" font-size="12" font-weight="700" text-anchor="middle">Admin Middleware (X-Admin-Key)</text>
    <text x="775" y="282" fill="#cbd5e1" font-size="10" text-anchor="middle">401 Interceptor on /api/admin/*</text>

    <rect x="920" y="250" width="200" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="1020" y="267" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">Static Asset Delivery</text>
    <text x="1020" y="282" fill="#94a3b8" font-size="10.5" text-anchor="middle">HTML, CSS, JS served from C++</text>
  </g>

  <!-- Connectors Tier 2 to 3 -->
  <line x1="640" y1="300" x2="640" y2="330" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="525" y="307" width="230" height="20" rx="10" fill="#4338ca"/>
  <text x="640" y="321" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">Direct C++ In-Memory Method Calls</text>

  <!-- TIER 3: CORE BANKING ENGINE -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="335" width="1000" height="175" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <rect x="140" y="335" width="1000" height="28" rx="10" fill="#312e81"/>
    <text x="160" y="354" fill="#c7d2fe" font-size="12" font-weight="800">TIER 3: C++ CORE BANKING ENGINE &amp; DOMAIN SERVICES</text>

    <!-- Components Grid -->
    <rect x="160" y="372" width="295" height="58" rx="6" fill="#1e293b" stroke="#4f46e5"/>
    <text x="307" y="394" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="middle">BankSystem (Facade)</text>
    <text x="307" y="412" fill="#94a3b8" font-size="11" text-anchor="middle">State Orchestrator, FIFO Queue, LIFO Stack</text>

    <rect x="475" y="372" width="310" height="58" rx="6" fill="#1e293b" stroke="#4f46e5"/>
    <text x="630" y="394" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="middle">Account Hierarchy (Polymorphic ABC)</text>
    <text x="630" y="412" fill="#94a3b8" font-size="11" text-anchor="middle">SavingsAccount (Min Bal) | CurrentAccount (Overdraft)</text>

    <rect x="805" y="372" width="315" height="58" rx="6" fill="#1e293b" stroke="#4f46e5"/>
    <text x="962" y="394" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="middle">CustomerManager</text>
    <text x="962" y="412" fill="#94a3b8" font-size="11" text-anchor="middle">std::unordered_map O(1) Key-Value Customer Registry</text>

    <!-- Row 2 -->
    <rect x="160" y="438" width="295" height="58" rx="6" fill="#1e293b" stroke="#4f46e5"/>
    <text x="307" y="460" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">SecurityHelper (Cryptography)</text>
    <text x="307" y="478" fill="#94a3b8" font-size="11" text-anchor="middle">PBKDF2-HMAC-SHA256, 128-bit CSPRNG Salt</text>

    <rect x="475" y="438" width="310" height="58" rx="6" fill="#1e293b" stroke="#4f46e5"/>
    <text x="630" y="460" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">TransactionAnalytics &amp; SmartAuditor</text>
    <text x="630" y="478" fill="#94a3b8" font-size="11" text-anchor="middle">Red-Black Tree std::map Totals, Health Score Rating</text>

    <rect x="805" y="438" width="315" height="58" rx="6" fill="#1e293b" stroke="#4f46e5"/>
    <text x="962" y="460" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">TransactionGraph (AML Engine)</text>
    <text x="962" y="478" fill="#94a3b8" font-size="11" text-anchor="middle">Directed Adjacency List &amp; DFS Cycle Detection</text>
  </g>

  <!-- Connectors to Tier 4 -->
  <line x1="300" y1="510" x2="300" y2="540" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="510" x2="640" y2="540" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="510" x2="980" y2="540" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TIER 4: STORAGE, RELATIONAL DB & FORENSICS -->
  <!-- Box 1: File Persistence -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="545" width="320" height="135" rx="10" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <rect x="140" y="545" width="320" height="28" rx="10" fill="#064e3b"/>
    <text x="155" y="564" fill="#a7f3d0" font-size="12" font-weight="700">ACID FILE PERSISTENCE LAYER</text>

    <text x="160" y="595" fill="#f1f5f9" font-size="12" font-weight="600">FilePersistence.cpp</text>
    <text x="160" y="612" fill="#94a3b8" font-size="11">&#8226; Atomic Swaps: writes to .tmp then renames</text>
    <text x="160" y="628" fill="#94a3b8" font-size="11">&#8226; Backup Disaster Recovery: .bak rehydration</text>
    <text x="160" y="644" fill="#94a3b8" font-size="11">&#8226; Plaintext PIN Auto-Migration on startup</text>
    <text x="160" y="660" fill="#6ee7b7" font-size="11" font-weight="600">&#8226; files: accounts.txt, customers.txt, txns.txt</text>
  </g>

  <!-- Box 2: MySQL Relational Layer -->
  <g filter="url(#cardShadow)">
    <rect x="480" y="545" width="320" height="135" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="480" y="545" width="320" height="28" rx="10" fill="#075985"/>
    <text x="495" y="564" fill="#bae6fd" font-size="12" font-weight="700">MYSQL 3NF RELATIONAL LAYER</text>

    <text x="500" y="595" fill="#f1f5f9" font-size="12" font-weight="600">DatabaseManager.cpp / MySqlSchema.h</text>
    <text x="500" y="612" fill="#94a3b8" font-size="11">&#8226; 3NF Normalized Schema DDL (schema.sql)</text>
    <text x="500" y="628" fill="#94a3b8" font-size="11">&#8226; Referential Integrity with ON DELETE CASCADE</text>
    <text x="500" y="644" fill="#94a3b8" font-size="11">&#8226; In-memory Relational INNER JOIN engine</text>
    <text x="500" y="660" fill="#7dd3fc" font-size="11" font-weight="600">&#8226; Live synchronized SQL dump (.sql)</text>
  </g>

  <!-- Box 3: AML Forensic Detection -->
  <g filter="url(#cardShadow)">
    <rect x="820" y="545" width="320" height="135" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <rect x="820" y="545" width="320" height="28" rx="10" fill="#881337"/>
    <text x="835" y="564" fill="#fecdd3" font-size="12" font-weight="700">FORENSIC AML GRAPH ENGINE</text>

    <text x="840" y="595" fill="#f1f5f9" font-size="12" font-weight="600">TransactionGraph.cpp (DFS Engine)</text>
    <text x="840" y="612" fill="#94a3b8" font-size="11">&#8226; Vertices = Accounts, Edges = Transfers</text>
    <text x="840" y="628" fill="#94a3b8" font-size="11">&#8226; Depth-First Search with recursion stack</text>
    <text x="840" y="644" fill="#94a3b8" font-size="11">&#8226; Detects circular cycles (A &#8594; B &#8594; C &#8594; A)</text>
    <text x="840" y="660" fill="#fda4af" font-size="11" font-weight="600">&#8226; Forensic visualizer in React Admin UI</text>
  </g>
</svg>