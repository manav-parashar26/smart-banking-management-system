<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowFk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad4)"/>
  <text x="640" y="40" fill="#f8fafc" font-size="24" font-weight="800" text-anchor="middle">RELATIONAL DATABASE ARCHITECTURE (MySQL 3NF)</text>
  <text x="640" y="64" fill="#94a3b8" font-size="14" font-weight="500" text-anchor="middle">Third Normal Form (3NF) Entity Schemas, Referential Constraints, Indexes, &amp; Relational Persistence</text>

  <!-- TABLE 1: CUSTOMERS -->
  <g filter="url(#shadow4)">
    <rect x="70" y="90" width="340" height="250" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="70" y="90" width="340" height="32" rx="8" fill="#0369a1"/>
    <text x="85" y="112" fill="#ffffff" font-size="14" font-weight="800">TABLE: customers (1NF, 2NF, 3NF)</text>

    <text x="85" y="145" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">&#128273; customer_id</text>
    <text x="240" y="145" fill="#94a3b8" font-size="11">VARCHAR(32) [PK]</text>

    <text x="85" y="175" fill="#f1f5f9" font-family="monospace" font-size="12">  full_name</text>
    <text x="240" y="175" fill="#94a3b8" font-size="11">VARCHAR(128)</text>

    <text x="85" y="205" fill="#f1f5f9" font-family="monospace" font-size="12">  email</text>
    <text x="240" y="205" fill="#94a3b8" font-size="11">VARCHAR(128)</text>

    <text x="85" y="235" fill="#f1f5f9" font-family="monospace" font-size="12">  phone</text>
    <text x="240" y="235" fill="#94a3b8" font-size="11">VARCHAR(32)</text>

    <text x="85" y="265" fill="#34d399" font-family="monospace" font-size="12">&#128274; pin</text>
    <text x="240" y="265" fill="#a7f3d0" font-size="11">VARCHAR(256) (PBKDF2)</text>

    <text x="85" y="295" fill="#f1f5f9" font-family="monospace" font-size="12">  created_at</text>
    <text x="240" y="295" fill="#94a3b8" font-size="11">TIMESTAMP DEFAULT NOW</text>

    <line x1="70" y1="308" x2="410" y2="308" stroke="#1e293b"/>
    <text x="85" y="325" fill="#38bdf8" font-size="10.5">Constraint: CONSTRAINT pk_customers PRIMARY KEY</text>
  </g>

  <!-- TABLE 2: ACCOUNTS -->
  <g filter="url(#shadow4)">
    <rect x="470" y="90" width="370" height="345" rx="8" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <rect x="470" y="90" width="370" height="32" rx="8" fill="#065f46"/>
    <text x="485" y="112" fill="#ffffff" font-size="14" font-weight="800">TABLE: accounts</text>

    <text x="485" y="145" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">&#128273; account_number</text>
    <text x="670" y="145" fill="#94a3b8" font-size="11">VARCHAR(32) [PK]</text>

    <text x="485" y="172" fill="#38bdf8" font-family="monospace" font-size="12">&#128279; customer_id</text>
    <text x="670" y="172" fill="#7dd3fc" font-size="11">VARCHAR(32) [FK]</text>

    <text x="485" y="199" fill="#f1f5f9" font-family="monospace" font-size="12">  account_type</text>
    <text x="670" y="199" fill="#94a3b8" font-size="11">VARCHAR(32)</text>

    <text x="485" y="226" fill="#f1f5f9" font-family="monospace" font-size="12">  holder_name</text>
    <text x="670" y="226" fill="#94a3b8" font-size="11">VARCHAR(128)</text>

    <text x="485" y="253" fill="#fbbf24" font-family="monospace" font-size="12">  balance</text>
    <text x="670" y="253" fill="#fde68a" font-size="11">DECIMAL(15,2)</text>

    <text x="485" y="280" fill="#f1f5f9" font-family="monospace" font-size="12">  is_active</text>
    <text x="670" y="280" fill="#94a3b8" font-size="11">BOOLEAN</text>

    <text x="485" y="307" fill="#f1f5f9" font-family="monospace" font-size="12">  interest_rate</text>
    <text x="670" y="307" fill="#94a3b8" font-size="11">DECIMAL(5,2)</text>

    <text x="485" y="334" fill="#f1f5f9" font-family="monospace" font-size="12">  minimum_balance</text>
    <text x="670" y="334" fill="#94a3b8" font-size="11">DECIMAL(15,2)</text>

    <text x="485" y="361" fill="#f1f5f9" font-family="monospace" font-size="12">  overdraft_limit</text>
    <text x="670" y="361" fill="#94a3b8" font-size="11">DECIMAL(15,2)</text>

    <line x1="470" y1="375" x2="840" y2="375" stroke="#1e293b"/>
    <text x="485" y="393" fill="#34d399" font-size="10.5">FK: CONSTRAINT fk_acc_customer REFERENCES customers</text>
    <text x="485" y="408" fill="#34d399" font-size="10.5">ON DELETE CASCADE ON UPDATE CASCADE</text>
    <text x="485" y="423" fill="#94a3b8" font-size="10">INDEXES: idx_acc_customer, idx_acc_balance</text>
  </g>

  <!-- TABLE 3: TRANSACTIONS -->
  <g filter="url(#shadow4)">
    <rect x="900" y="90" width="320" height="345" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <rect x="900" y="90" width="320" height="32" rx="8" fill="#b45309"/>
    <text x="915" y="112" fill="#ffffff" font-size="14" font-weight="800">TABLE: transactions</text>

    <text x="915" y="145" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">&#128273; transaction_id</text>
    <text x="1080" y="145" fill="#94a3b8" font-size="11">VARCHAR(32) [PK]</text>

    <text x="915" y="172" fill="#34d399" font-family="monospace" font-size="12">&#128279; from_account</text>
    <text x="1080" y="172" fill="#7dd3fc" font-size="11">VARCHAR(32) [FK]</text>

    <text x="915" y="199" fill="#34d399" font-family="monospace" font-size="12">&#128279; to_account</text>
    <text x="1080" y="199" fill="#7dd3fc" font-size="11">VARCHAR(32) [FK]</text>

    <text x="915" y="226" fill="#f1f5f9" font-family="monospace" font-size="12">  amount</text>
    <text x="1080" y="226" fill="#94a3b8" font-size="11">DECIMAL(15,2)</text>

    <text x="915" y="253" fill="#f1f5f9" font-family="monospace" font-size="12">  timestamp</text>
    <text x="1080" y="253" fill="#94a3b8" font-size="11">TIMESTAMP</text>

    <text x="915" y="280" fill="#f1f5f9" font-family="monospace" font-size="12">  type_id / type_name</text>
    <text x="1080" y="280" fill="#94a3b8" font-size="11">INT / VARCHAR(32)</text>

    <text x="915" y="307" fill="#f1f5f9" font-family="monospace" font-size="12">  status_id / name</text>
    <text x="1080" y="307" fill="#94a3b8" font-size="11">INT / VARCHAR(32)</text>

    <text x="915" y="334" fill="#f1f5f9" font-family="monospace" font-size="12">  description</text>
    <text x="1080" y="334" fill="#94a3b8" font-size="11">TEXT</text>

    <line x1="900" y1="365" x2="1220" y2="365" stroke="#1e293b"/>
    <text x="915" y="388" fill="#fde68a" font-size="10.5">Constraint: CONSTRAINT pk_transactions</text>
    <text x="915" y="405" fill="#94a3b8" font-size="10">INDEXES: idx_txn_from, idx_txn_to, idx_txn_timestamp</text>
  </g>

  <!-- TABLE 4: PENDING_REQUESTS -->
  <g filter="url(#shadow4)">
    <rect x="70" y="470" width="340" height="210" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="70" y="470" width="340" height="32" rx="8" fill="#6d28d9"/>
    <text x="85" y="492" fill="#ffffff" font-size="14" font-weight="800">TABLE: pending_requests</text>

    <text x="85" y="525" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="700">&#128273; request_id</text>
    <text x="240" y="525" fill="#94a3b8" font-size="11">VARCHAR(32) [PK]</text>

    <text x="85" y="552" fill="#38bdf8" font-family="monospace" font-size="12">&#128279; customer_id</text>
    <text x="240" y="552" fill="#7dd3fc" font-size="11">VARCHAR(32) [FK]</text>

    <text x="85" y="579" fill="#f1f5f9" font-family="monospace" font-size="12">  account_number</text>
    <text x="240" y="579" fill="#94a3b8" font-size="11">VARCHAR(32)</text>

    <text x="85" y="606" fill="#f1f5f9" font-family="monospace" font-size="12">  type / status</text>
    <text x="240" y="606" fill="#94a3b8" font-size="11">VARCHAR(32)</text>

    <text x="85" y="633" fill="#f1f5f9" font-family="monospace" font-size="12">  amount / notes</text>
    <text x="240" y="633" fill="#94a3b8" font-size="11">DECIMAL / TEXT</text>

    <line x1="70" y1="645" x2="410" y2="645" stroke="#1e293b"/>
    <text x="85" y="665" fill="#c4b5fd" font-size="10.5">FK: CONSTRAINT fk_req_customer REFERENCES customers</text>
  </g>

  <!-- TABLE 5: AUDIT_LOGS -->
  <g filter="url(#shadow4)">
    <rect x="470" y="470" width="370" height="210" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
    <rect x="470" y="470" width="370" height="32" rx="8" fill="#be185d"/>
    <text x="485" y="492" fill="#ffffff" font-size="14" font-weight="800">TABLE: audit_logs</text>

    <text x="485" y="525" fill="#f472b6" font-family="monospace" font-size="12" font-weight="700">&#128273; log_id</text>
    <text x="670" y="525" fill="#94a3b8" font-size="11">INT AUTO_INC [PK]</text>

    <text x="485" y="555" fill="#f1f5f9" font-family="monospace" font-size="12">  event_type</text>
    <text x="670" y="555" fill="#94a3b8" font-size="11">VARCHAR(64)</text>

    <text x="485" y="585" fill="#f1f5f9" font-family="monospace" font-size="12">  details</text>
    <text x="670" y="585" fill="#94a3b8" font-size="11">TEXT (Payload)</text>

    <text x="485" y="615" fill="#f1f5f9" font-family="monospace" font-size="12">  logged_at</text>
    <text x="670" y="615" fill="#94a3b8" font-size="11">TIMESTAMP NOW</text>

    <line x1="470" y1="645" x2="840" y2="645" stroke="#1e293b"/>
    <text x="485" y="665" fill="#f472b6" font-size="10.5">Constraint: CONSTRAINT pk_audit_logs PRIMARY KEY (log_id)</text>
  </g>

  <!-- RELATIONAL PERSISTENCE SUMMARY CARD -->
  <g filter="url(#shadow4)">
    <rect x="900" y="470" width="320" height="210" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="900" y="470" width="320" height="32" rx="8" fill="#1e293b"/>
    <text x="915" y="492" fill="#f8fafc" font-size="14" font-weight="800">3NF &amp; PERSISTENCE SUMMARY</text>

    <text x="915" y="525" fill="#38bdf8" font-size="12" font-weight="700">1NF:</text>
    <text x="955" y="525" fill="#cbd5e1" font-size="11">Atomic columns, no repeating groups</text>

    <text x="915" y="550" fill="#38bdf8" font-size="12" font-weight="700">2NF:</text>
    <text x="955" y="550" fill="#cbd5e1" font-size="11">Full functional dependency on PKs</text>

    <text x="915" y="575" fill="#38bdf8" font-size="12" font-weight="700">3NF:</text>
    <text x="955" y="575" fill="#cbd5e1" font-size="11">No transitive dependencies (customer_id FK)</text>

    <line x1="900" y1="590" x2="1220" y2="590" stroke="#1e293b"/>
    <text x="915" y="612" fill="#10b981" font-size="11" font-weight="700">&#10004; Referential Integrity Check: 0 orphans</text>
    <text x="915" y="632" fill="#10b981" font-size="11" font-weight="700">&#10004; Relational INNER JOIN engine verified</text>
    <text x="915" y="652" fill="#10b981" font-size="11" font-weight="700">&#10004; Live MySQL SQL dump synchronized</text>
  </g>

  <!-- RELATIONAL ARROWS -->
  <!-- Customers to Accounts (1:N) -->
  <path d="M 410 170 L 470 170" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowFk)"/>
  <rect x="422" y="158" width="36" height="18" rx="4" fill="#0369a1"/>
  <text x="440" y="171" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1 : N</text>

  <!-- Accounts to Transactions (1:N) -->
  <path d="M 840 185 L 900 185" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFk)"/>
  <rect x="852" y="173" width="36" height="18" rx="4" fill="#065f46"/>
  <text x="870" y="186" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1 : N</text>

  <!-- Customers to Pending Requests (1:N) -->
  <path d="M 240 340 L 240 470" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowFk)"/>
  <rect x="222" y="395" width="36" height="18" rx="4" fill="#6d28d9"/>
  <text x="240" y="408" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1 : N</text>
</svg>